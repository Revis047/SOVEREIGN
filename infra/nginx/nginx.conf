events {
    worker_connections 1024;
}

http {
    upstream rust_api {
        server rust-api:8000;
    }

    upstream go_services {
        server go-perception:8001;
        server go-payments:8002;
    }

    server {
        listen 80;

        location /api/v1/state {
            proxy_pass http://rust_api/state;
        }

        location /api/v1/perception {
            proxy_pass http://go_services;
        }

        location / {
            proxy_pass http://dashboard:3000;
        }
    }
}
