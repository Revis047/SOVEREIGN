services:
  kafka:
    image: apache/kafka:latest
    ports: ["9092:9092"]
  nats:
    image: nats:latest
    ports: ["4222:4222", "8222:8222"]
  redis:
    image: redis:latest
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: sovereign
    ports: ["5432:5432"]
  temporal-server:
    image: temporalio/auto-setup:latest
    ports: ["7233:7233"]
    environment:
      DB: postgresql
      POSTGRES_USER: sovereign
      POSTGRES_PWD: sovereign
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]
