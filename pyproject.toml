[tool.poetry]
name = "sovereign-omega"
version = "0.1.0"
description = "SOVEREIGN-Ω :: Self-Organizing Vanguard Entity with Recursive Emergent Intelligence"
authors = ["Ver <ver@storyvault.media>"]
readme = "README.md"
packages = [{include = "core"}, {include = "layers"}, {include = "agents"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
python-dotenv = "1.2.2"
pydantic = ">=2.11.9,<2.13"
fastapi = "0.115.14"
uvicorn = "0.34.3"
redis = "5.3.1"
qdrant-client = "1.12.1"
numpy = "1.26.4"
scipy = "1.17.1"
networkx = "3.6.1"
aiohttp = "3.14.1"
httpx = "0.28.1"
structlog = "25.5.0"
opentelemetry-sdk = "1.34.1"
prometheus-client = "0.21.1"
temporalio = "1.29.0"
nats-py = "2.15.0"
aiokafka = "0.12.0"
sentence-transformers = "3.4.1"
spacy = "3.8.14"
dspy-ai = "2.6.27"
langgraph = "0.2.76"
crewai = "1.14.7"
mesa = "3.5.1"
pyswarms = "1.3.0"
deap = "1.4.4"
pennylane = "0.40.0"
dwave-ocean-sdk = "7.1.0"
torch = "2.12.1"
beautifulsoup4 = "^4.15.0"
pandas = "^3.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.0"
pytest-asyncio = "1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
